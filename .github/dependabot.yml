version: 2
updates:
  - package-ecosystem: gomod
    directories: ["/", "/api"]
    schedule:
      interval: weekly
      day: monday
    groups:
      go-backend:
        patterns: ["github.com/ahmedbaig/*"]
      dependencies:
        patterns: ["*"]
        exclude-patterns: ["github.com/ahmedbaig/*"]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
